name: Build Development Tools Binaries

# Manual builds only: Windows ZIP, macOS tar.gz and Linux DEB.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: Vircon32-DevelopmentTools
  SOURCE_DIR: DevelopmentTools
  TOOLS: >-
    compile assemble packrom png2vircon wav2vircon tiled2vircon joinpngs
    disassemble unpackrom vircon2png vircon2wav

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os-runner }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x86_64
            os-runner: windows-latest
            msystem: UCRT64
            msys-packages: >-
              mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-libpng unzip
          - os: windows
            arch: arm64
            os-runner: windows-11-arm
            msystem: CLANGARM64
            msys-packages: >-
              mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-SDL2 mingw-w64-clang-aarch64-libpng unzip

          - os: linux
            arch: x86_64
            os-runner: ubuntu-24.04
          - os: linux
            arch: arm64
            os-runner: ubuntu-24.04-arm

          - os: macos
            arch: arm64
            os-runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSYS2 Toolchain (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys-packages }}

      - name: Read Version
        run: |
          CMAKE_FILE="${SOURCE_DIR}/CMakeLists.txt"
          part() {
            sed -n "s/^set(PROJECT_VERSION_$1[[:space:]][[:space:]]*\([0-9][0-9]*\)).*/\1/p" "$CMAKE_FILE" | head -n 1
          }
          MAJOR=$(part MAJOR); MINOR=$(part MINOR); PATCH=$(part PATCH)
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error file=$CMAKE_FILE::could not read PROJECT_VERSION_MAJOR/MINOR/PATCH from $CMAKE_FILE"
            exit 1
          fi
          VERSION=$(printf '%d.%02d.%02d' "$((10#$MAJOR))" "$((10#$MINOR))" "$((10#$PATCH))")
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config dpkg-dev \
            libsdl2-dev libpng-dev

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install sdl2 libpng cmake

      - name: Build (Windows)
        if: matrix.os == 'windows'
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export CC=gcc CXX=g++
            STRIP=strip
          else
            export CC=clang CXX=clang++
            STRIP=llvm-strip
          fi
          # Use matching MSYS2 DLLs instead of the bundled x64 runtime.
          mkdir -p build/empty-runtime
          cmake -S "$SOURCE_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/stage/Vircon32" \
            -DRUNTIME_DIR:STRING=../build/empty-runtime \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build
          for t in $TOOLS; do "$STRIP" "build/$t.exe"; done

      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -S "$SOURCE_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build
          for t in $TOOLS; do strip "build/$t"; done

      - name: Build (macOS)
        if: matrix.os == 'macos'
        run: |
          # CMake does not find Homebrew libpng headers automatically.
          BREW="$(brew --prefix)"
          ls -l "$BREW/include/png.h" "$BREW/include/SDL2/SDL.h"
          export CPATH="$BREW/include"
          export LIBRARY_PATH="$BREW/lib"
          cmake -S "$SOURCE_DIR" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/stage" \
            -DCMAKE_PREFIX_PATH="$BREW" \
            -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES="$BREW/include" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          for t in $TOOLS; do
            strip "build/$t"
            codesign --force --sign - "build/$t"
          done

      - name: Check Dependencies and Start-up
        run: |
          EXT=""; if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          FAILED=0

          for t in $TOOLS; do
            BIN="build/$t$EXT"
            [ -f "$BIN" ] || { echo "::error::$BIN was not built"; FAILED=1; continue; }
            if [ "${{ matrix.os }}" = "linux" ] && ldd "$BIN" | grep -q "not found"; then
              ldd "$BIN"
              echo "::error::$BIN has unresolved shared libraries"; FAILED=1; continue
            fi
            OUT=$("$BIN" --version 2>&1) || { echo "::error::$BIN --version failed: $OUT"; FAILED=1; continue; }
            case "$OUT" in
              *"$t v$VERSION"*) echo "ok: $OUT" | head -n 1 ;;
              *) echo "::error::$BIN --version printed '$OUT', expected '$t v$VERSION'"; FAILED=1 ;;
            esac
          done
          [ "$FAILED" = 0 ]

          case "${{ matrix.os }}" in
            linux)
              ldd "build/compile" ;;
            macos)
              otool -L "build/compile" ;;
            windows)
              mapfile -t DLLS < <(for t in $TOOLS; do ldd "build/$t$EXT"; done \
                | awk '/=>/ {print $3}' | grep -i "^$MSYSTEM_PREFIX/" | sort -u)
              printf 'needs: %s\n' "${DLLS[@]}"
              printf '%s\n' "${DLLS[@]}" > build/needed-dlls.txt ;;
          esac

      - name: Install and Package (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo cmake --install build
          # DESTDIR includes absolute destinations such as /usr/share as well.
          # The CMake install scripts also chmod the installed files.
          sudo cpack --config build/CPackConfig.cmake -G DEB -B build/package \
            -D CPACK_SET_DESTDIR=ON \
            -D "CPACK_PACKAGE_FILE_NAME=$PACKAGE_NAME-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp build/package/*.deb dist/
          for package in dist/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done

      - name: Install and Package (Windows and macOS)
        if: matrix.os != 'linux'
        run: |
          cmake --install build
          DEST="stage/Vircon32/DevTools"
          if [ "${{ matrix.os }}" = "windows" ]; then
            while IFS= read -r dll; do
              [ -z "$dll" ] || cp "$dll" "$DEST/"
            done < build/needed-dlls.txt
          fi
          if [ -f LICENSE ]; then
            cp LICENSE "$DEST/"
          elif [ -f License.md ]; then
            cp License.md "$DEST/"
          fi
          ls "$DEST/include/"*.h > /dev/null

          mkdir -p dist
          ARCHIVE="$PACKAGE_NAME-$VERSION-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            # CMake's ZIP implementation avoids needing a separate zip utility.
            (cd stage && cmake -E tar cf "../dist/$ARCHIVE.zip" --format=zip Vircon32)
            unzip -l "dist/$ARCHIVE.zip"
          else
            # tar preserves the executable bits on macOS.
            tar -czf "dist/$ARCHIVE.tar.gz" -C stage Vircon32
            tar -tzf "dist/$ARCHIVE.tar.gz"
          fi

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          path: dist/*
          if-no-files-found: error
          # Upload the single package directly, without wrapping it in another ZIP.
          archive: false
